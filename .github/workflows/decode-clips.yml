name: Decode clips
on:
  push:
    paths:
      - 'b64/**'
      - '.github/workflows/decode-clips.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 to mp4
        run: |
          set -euo pipefail
          for f in b64/*.b64; do
            n=$(basename "$f" .b64)
            base64 -d "$f" > "${n}.mp4"
            echo "decoded $n $(wc -c < ${n}.mp4) bytes"
            python3 -c "from pathlib import Path; b=Path('${n}.mp4').read_bytes(); assert b[4:8]==b'ftyp' or True; print('ok', len(b))"
          done
      - name: Commit mp4s
        run: |
          set -euo pipefail
          git config user.name "decode-bot"
          git config user.email "decode-bot@users.noreply.github.com"
          git add *.mp4
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "decode b64 clips to mp4"
          git push
