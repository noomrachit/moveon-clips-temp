name: Decode clips
on:
  push:
    paths:
      - 'b64/**'
      - '.github/workflows/decode-clips.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Concat parts and decode to mp4
        run: |
          set -euo pipefail
          for n in 01 02 03 04; do
            ls b64/${n}.part* | sort | xargs cat > /tmp/${n}.b64
            tr -d ' \n\r\t' < /tmp/${n}.b64 > /tmp/${n}.clean.b64
            base64 -d /tmp/${n}.clean.b64 > ${n}.mp4
            echo "decoded $n $(wc -c < ${n}.mp4) bytes"
            python3 -c "from pathlib import Path; b=Path('${n}.mp4').read_bytes(); assert len(b)>1000; print('ok', len(b))"
          done
      - name: Commit mp4s
        run: |
          set -euo pipefail
          git config user.name "decode-bot"
          git config user.email "decode-bot@users.noreply.github.com"
          git add 01.mp4 02.mp4 03.mp4 04.mp4
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "decode b64 parts to mp4"
          git push
